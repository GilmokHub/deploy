upstream demo_backend {
    server demo-backend:8080;
}

upstream demo_frontend {
    server demo-frontend:8080;
}

upstream demo_watchtower {
    server watchtower:8080;
}

server {
    listen 80;
    server_name localhost;

    # Let's Encrypt 인증서 발급 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Watchtower 웹훅 신호 프록시 (CD 연동)
    location /watchtower/ {
        proxy_pass http://demo_watchtower/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 데모 백엔드 context-path 라우팅 (/gilmok-demo/)
    location /gilmok-demo/ {
        proxy_pass http://demo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 헬스체크 공개 엔드포인트 (CD 검증용 200 OK 허용)
    location = /gilmok-demo/actuator/health {
        proxy_pass http://demo_backend;
        proxy_set_header Host $host;
    }

    # 민감 Actuator 엔드포인트 외부 차단 (사설망 허용)
    location /gilmok-demo/actuator/ {
        allow 10.0.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://demo_backend;
        proxy_set_header Host $host;
    }

    # 프론트엔드 기본 서빙
    location / {
        proxy_pass http://demo_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
