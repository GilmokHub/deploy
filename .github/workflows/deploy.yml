name: Deploy to OCI (MSA)

on:
  repository_dispatch:
    types: [update-image]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Resolve deploy parameters
        id: params
        run: |
          TARGET="${{ github.event.client_payload.target }}"
          TARGET="${TARGET:-oci}"   # target 없으면 기본값 oci (기존 트리거 호환)
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "service_name=${{ github.event.client_payload.service_name }}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.event.client_payload.image_tag }}" >> $GITHUB_OUTPUT

          if [ "$TARGET" = "aws" ]; then
            echo "frontend_url=${{ secrets.AWS_FRONTEND_URL }}"       >> $GITHUB_OUTPUT
            echo "monitoring_host=${{ secrets.AWS_MONITORING_HOST }}" >> $GITHUB_OUTPUT
            echo "prometheus_url=${{ secrets.AWS_PROMETHEUS_URL }}"   >> $GITHUB_OUTPUT
          else
            echo "frontend_url=${{ secrets.OCI_FRONTEND_URL }}"       >> $GITHUB_OUTPUT
            echo "monitoring_host=${{ secrets.OCI_MONITORING_HOST }}" >> $GITHUB_OUTPUT
            echo "prometheus_url=${{ secrets.OCI_PROMETHEUS_URL }}"   >> $GITHUB_OUTPUT
          fi

      - name: SSH Remote Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          FRONTEND_URL: ${{ steps.params.outputs.frontend_url }}
          MONITORING_HOST: ${{ steps.params.outputs.monitoring_host }}
          PROMETHEUS_URL: ${{ steps.params.outputs.prometheus_url }}
          DEPLOY_SERVICE_NAME: ${{ steps.params.outputs.service_name }}
          DEPLOY_IMAGE_TAG: ${{ steps.params.outputs.image_tag }}
          DEPLOY_TARGET: ${{ steps.params.outputs.target }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PROJECT_ID: ${{ secrets.GEMINI_PROJECT_ID }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        with:
          host: ${{ steps.params.outputs.target == 'aws' && secrets.AWS_EC2_HOST || secrets.OCI_HOST }}
          username: ${{ steps.params.outputs.target == 'aws' && secrets.AWS_EC2_USERNAME || secrets.OCI_USERNAME }}
          key: ${{ steps.params.outputs.target == 'aws' && secrets.AWS_EC2_KEY || secrets.OCI_KEY }}
          timeout: 1200s
          envs: FRONTEND_URL,MONITORING_HOST,PROMETHEUS_URL,DEPLOY_SERVICE_NAME,DEPLOY_IMAGE_TAG,DEPLOY_TARGET,DB_URL,DB_USERNAME,DB_PASSWORD,REDIS_URL,JWT_SECRET,GEMINI_API_KEY,GEMINI_PROJECT_ID,GHCR_TOKEN,GHCR_USERNAME
          script: |
            set -euo pipefail
            trap 'echo "❌ 실패한 줄: $LINENO, 명령어: $BASH_COMMAND"' ERR

            LOCK_FILE=/var/tmp/msa_deploy.lock
            
            exec 200>|"$LOCK_FILE"
            echo "⏳ 락(Lock) 획득 대기 중..."
            if ! flock -w 1200 200; then
              echo "❌ Error: 다른 배포 작업이 너무 오래 걸려 락 획득에 실패했습니다."
              exit 1
            fi
            echo "🔒 락 획득 완료! 배포를 시작합니다."

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            SERVICE_NAME="$DEPLOY_SERVICE_NAME"
            IMAGE_TAG="$DEPLOY_IMAGE_TAG"

            case "$SERVICE_NAME" in
              gateway-server|api-server|auth-server|frontend-server) ;;
              *) echo "❌ Error: Invalid Service Name ($SERVICE_NAME). Not allowed."; exit 1 ;;
            esac

            if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "❌ Error: Invalid Image Tag"; exit 1
            fi

            REQUIRED_VARS=(
              "FRONTEND_URL"
              "DB_URL" "DB_USERNAME" "DB_PASSWORD"
              "REDIS_URL"
              "JWT_SECRET" "GEMINI_API_KEY" "GEMINI_PROJECT_ID"
              "GHCR_TOKEN" "GHCR_USERNAME"
              "MONITORING_HOST"
              "PROMETHEUS_URL"
            )
            for VAR_NAME in "${REQUIRED_VARS[@]}"; do
              if [[ -z "${!VAR_NAME}" ]]; then
                echo "❌ Error: Required env var '$VAR_NAME' is empty."; exit 1
              fi
            done

            echo "🚀 Start Deploy: $SERVICE_NAME (Tag: $IMAGE_TAG)"
            mkdir -p ~/app/nginx/conf.d && cd ~/app

            if command -v docker-compose &> /dev/null; then
              DOCKER_COMPOSE="docker-compose"
            else
              DOCKER_COMPOSE="docker compose"
            fi

            run_compose() {
              sudo $DOCKER_COMPOSE "$@"
            }

            is_nginx_running() {
              [ "$(sudo docker ps -f name=^nginx$ -f status=running --format '{{.Names}}')" = "nginx" ]
            }

            start_and_verify_nginx() {
              run_compose up -d nginx
              echo "Waiting for nginx to start..."
              for i in {1..6}; do
                nginx_status="$(sudo docker inspect --format='{{.State.Status}}' nginx 2>/dev/null || echo "unknown")"
                if [ "$nginx_status" = "running" ]; then
                  echo "✅ Nginx is running."; return 0
                elif [ "$nginx_status" = "exited" ] || [ "$nginx_status" = "dead" ]; then
                  echo "❌ Nginx failed to start."; return 1
                fi
                if [ "$i" -eq 6 ]; then
                  echo "❌ Nginx did not start in time."; return 1
                fi
                echo "Waiting... ($i/6)"; sleep 3
              done
            }

            render_nginx_conf() {
              local upstream_host="$1"
              {
                printf 'upstream gateway_backend {\n'
                printf '  server %s:8080;\n' "$upstream_host"
                printf '}\n\n'
                printf 'server {\n'
                printf '  listen 80;\n\n'
                printf '  resolver 127.0.0.11 valid=10s;\n\n'

                printf '  location /grafana {\n'
                printf '    return 301 /grafana/;\n'
                printf '  }\n\n'
                printf '  location /grafana/ {\n'
                printf '    proxy_pass http://%s:3000/grafana/;\n' "$MONITORING_HOST"
                printf '    proxy_http_version 1.1;\n'
                printf '    proxy_set_header Upgrade $http_upgrade;\n'
                printf '    proxy_set_header Connection "upgrade";\n'
                printf '    proxy_set_header Host $host;\n'
                printf '    proxy_set_header X-Real-IP $remote_addr;\n'
                printf '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n'
                printf '  }\n\n'

                printf '  location / {\n'
                printf '    set $frontend_upstream http://frontend:8080;\n'
                printf '    proxy_pass $frontend_upstream;\n'
                printf '    proxy_set_header Host $host;\n'
                printf '    proxy_set_header X-Real-IP $remote_addr;\n'
                printf '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n'
                printf '  }\n\n'
            
                printf '  location = /swagger-ui {\n'
                printf '    return 301 /swagger-ui/;\n'
                printf '  }\n\n'
                printf '  location /swagger-ui/ {\n'
                printf '    proxy_pass http://gateway_backend;\n'
                printf '    proxy_set_header Host $host;\n'
                printf '    proxy_set_header X-Real-IP $remote_addr;\n'
                printf '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n'
                printf '  }\n\n'
                
                printf '  location /v3/api-docs {\n'
                printf '    proxy_pass http://gateway_backend;\n'
                printf '    proxy_set_header Host $host;\n'
                printf '    proxy_set_header X-Real-IP $remote_addr;\n'
                printf '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n'
                printf '  }\n\n'
                
                printf '  location /v3/api-docs/ {\n'
                printf '    proxy_pass http://gateway_backend;\n'
                printf '    proxy_set_header Host $host;\n'
                printf '    proxy_set_header X-Real-IP $remote_addr;\n'
                printf '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n'
                printf '  }\n\n'
            
                printf '  location ~ ^/api/(admin|users|auth|events|queue|reservations)(/|$) {\n'
                printf '    rewrite ^/api/(.*)$ /$1 break;\n'
                printf '    proxy_pass http://gateway_backend;\n'
                printf '    proxy_set_header Host $host;\n'
                printf '    proxy_set_header X-Real-IP $remote_addr;\n'
                printf '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n'
                printf '  }\n\n'

                printf '  location ~ ^/actuator(/|$) {\n'
                printf '    allow 127.0.0.1;\n'
                printf '    allow 172.16.0.0/12;\n'
                printf '    allow %s;\n' "$MONITORING_HOST"
                printf '    deny all;\n'
                printf '    proxy_pass http://gateway_backend;\n'
                printf '  }\n'
                printf '}\n'
              } > ./nginx/conf.d/default.conf
            }

            hc_cmd() {
              local url="$1"
              printf '    healthcheck:\n'
              printf '      test: ["CMD-SHELL", "if command -v wget >/dev/null 2>&1; then wget -q --spider %s; elif command -v curl >/dev/null 2>&1; then curl -fsS %s >/dev/null; else exit 1; fi"]\n' "$url" "$url"
            }

            ACTIVE_GATEWAY="gateway-blue"
            if [ -f ./nginx/conf.d/default.conf ] && grep -q "server gateway-green:8080;" ./nginx/conf.d/default.conf; then
              ACTIVE_GATEWAY="gateway-green"
            fi

            if [ ! -f ./nginx/conf.d/default.conf ] || ! grep -q "proxy_pass http://frontend" ./nginx/conf.d/default.conf; then
              echo "⚙️ Creating Nginx config for $ACTIVE_GATEWAY..."
              render_nginx_conf "$ACTIVE_GATEWAY"
            fi

            echo "🌐 Ensuring docker network 'msa-network' exists..."
            if ! sudo docker network ls --format '{{.Name}}' | grep -wq "^msa-network$"; then
              sudo docker network create msa-network
            fi

            EXISTING_GATEWAY_TAG=""
            EXISTING_API_TAG=""
            EXISTING_AUTH_TAG=""
            EXISTING_FRONTEND_TAG=""
            if [ -f .env ]; then
              EXISTING_GATEWAY_TAG=$(grep "^GATEWAY_TAG=" .env 2>/dev/null | tail -1 | cut -d= -f2- || echo "")
              EXISTING_API_TAG=$(grep "^API_TAG=" .env 2>/dev/null | tail -1 | cut -d= -f2- || echo "")
              EXISTING_AUTH_TAG=$(grep "^AUTH_TAG=" .env 2>/dev/null | tail -1 | cut -d= -f2- || echo "")
              EXISTING_FRONTEND_TAG=$(grep "^FRONTEND_TAG=" .env 2>/dev/null | tail -1 | cut -d= -f2- || echo "")
            fi

            rm -f .env.tmp
            ( umask 077 && touch .env.tmp ) || { echo "❌ .env.tmp 생성 실패, pwd=$(pwd)"; exit 1; }
            
            printf 'FRONTEND_URL=%s\n' "$FRONTEND_URL" >> .env.tmp
            printf 'DB_URL=%s\n' "$DB_URL" >> .env.tmp
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME" >> .env.tmp
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" >> .env.tmp
            printf 'REDIS_URL=%s\n' "$REDIS_URL" >> .env.tmp
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET" >> .env.tmp
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env.tmp
            printf 'GEMINI_PROJECT_ID=%s\n' "$GEMINI_PROJECT_ID" >> .env.tmp
            printf 'PROMETHEUS_URL=%s\n' "$PROMETHEUS_URL" >> .env.tmp

            if [[ "$SERVICE_NAME" == "gateway-server" ]]; then
              printf 'GATEWAY_TAG=%s\n' "$IMAGE_TAG" >> .env.tmp
              [ -n "$EXISTING_API_TAG" ] && printf 'API_TAG=%s\n' "$EXISTING_API_TAG" >> .env.tmp
              [ -n "$EXISTING_AUTH_TAG" ] && printf 'AUTH_TAG=%s\n' "$EXISTING_AUTH_TAG" >> .env.tmp
              [ -n "$EXISTING_FRONTEND_TAG" ] && printf 'FRONTEND_TAG=%s\n' "$EXISTING_FRONTEND_TAG" >> .env.tmp
            elif [[ "$SERVICE_NAME" == "api-server" ]]; then
              [ -n "$EXISTING_GATEWAY_TAG" ] && printf 'GATEWAY_TAG=%s\n' "$EXISTING_GATEWAY_TAG" >> .env.tmp
              printf 'API_TAG=%s\n' "$IMAGE_TAG" >> .env.tmp
              [ -n "$EXISTING_AUTH_TAG" ] && printf 'AUTH_TAG=%s\n' "$EXISTING_AUTH_TAG" >> .env.tmp
              [ -n "$EXISTING_FRONTEND_TAG" ] && printf 'FRONTEND_TAG=%s\n' "$EXISTING_FRONTEND_TAG" >> .env.tmp
            elif [[ "$SERVICE_NAME" == "auth-server" ]]; then
              [ -n "$EXISTING_GATEWAY_TAG" ] && printf 'GATEWAY_TAG=%s\n' "$EXISTING_GATEWAY_TAG" >> .env.tmp
              [ -n "$EXISTING_API_TAG" ] && printf 'API_TAG=%s\n' "$EXISTING_API_TAG" >> .env.tmp
              printf 'AUTH_TAG=%s\n' "$IMAGE_TAG" >> .env.tmp
              [ -n "$EXISTING_FRONTEND_TAG" ] && printf 'FRONTEND_TAG=%s\n' "$EXISTING_FRONTEND_TAG" >> .env.tmp
            elif [[ "$SERVICE_NAME" == "frontend-server" ]]; then
              [ -n "$EXISTING_GATEWAY_TAG" ] && printf 'GATEWAY_TAG=%s\n' "$EXISTING_GATEWAY_TAG" >> .env.tmp
              [ -n "$EXISTING_API_TAG" ] && printf 'API_TAG=%s\n' "$EXISTING_API_TAG" >> .env.tmp
              [ -n "$EXISTING_AUTH_TAG" ] && printf 'AUTH_TAG=%s\n' "$EXISTING_AUTH_TAG" >> .env.tmp
              printf 'FRONTEND_TAG=%s\n' "$IMAGE_TAG" >> .env.tmp
            fi

            mv .env.tmp .env
            chmod 600 .env

            {
              printf 'services:\n'
              printf '  nginx:\n'
              printf '    image: nginx:1.25.4-alpine\n'
              printf '    container_name: nginx\n'
              printf '    ports:\n'
              printf '      - "80:80"\n'
              printf '    volumes:\n'
              printf '      - ./nginx/conf.d:/etc/nginx/conf.d\n'
              printf '    restart: always\n'
              printf '    networks:\n'
              printf '      - msa-network\n\n'

              for COLOR in blue green; do
                PORT=$( [ "$COLOR" = "blue" ] && echo "8081" || echo "8082" )
                printf '  gateway-%s:\n' "$COLOR"
                printf '    image: ghcr.io/gilmokhub/gateway:${GATEWAY_TAG:-latest}\n'
                printf '    container_name: gateway-%s\n' "$COLOR"
                printf '    ports:\n'
                printf '      - "%s:8080"\n' "$PORT"
                printf '    environment:\n'
                printf '      - SERVER_PORT=8080\n'
                printf '      - SPRING_PROFILES_ACTIVE=prod\n'
                printf '      - API_SERVER_URL=http://api-server:8080\n'
                printf '      - AUTH_SERVER_URL=http://auth-server:9000\n'
                printf '      - FRONTEND_URL=${FRONTEND_URL}\n'
                printf '      - SPRING_DATASOURCE_URL=${DB_URL}\n'
                printf '      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}\n'
                printf '      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}\n'
                printf '      - SPRING_DATA_REDIS_URL=${REDIS_URL}\n'
                printf '      - APP_JWT_SECRET=${JWT_SECRET}\n'
                printf '    extra_hosts:\n'
                printf '      - "host.docker.internal:host-gateway"\n'
                printf '    networks:\n'
                printf '      - msa-network\n'
                hc_cmd_str="http://localhost:8080/actuator/health"
                printf '    healthcheck:\n'
                printf '      test: ["CMD-SHELL", "if command -v wget >/dev/null 2>&1; then wget -q --spider %s; elif command -v curl >/dev/null 2>&1; then curl -fsS %s >/dev/null; else exit 1; fi"]\n' "$hc_cmd_str" "$hc_cmd_str"
                printf '      interval: 10s\n'
                printf '      timeout: 5s\n'
                printf '      retries: 3\n'
                printf '      start_period: 360s\n\n'
              done

              printf '  api-server:\n'
              printf '    image: ghcr.io/gilmokhub/api:${API_TAG:-latest}\n'
              printf '    container_name: api-server\n'
              printf '    ports:\n'
              printf '      - "8083:8080"\n'
              printf '    restart: always\n'
              printf '    environment:\n'
              printf '      - TZ=Asia/Seoul\n'
              printf '      - SPRING_PROFILES_ACTIVE=prod\n'
              printf '      - SPRING_DATASOURCE_URL=${DB_URL}\n'
              printf '      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}\n'
              printf '      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}\n'
              printf '      - SPRING_DATA_REDIS_URL=${REDIS_URL}\n'
              printf '      - APP_JWT_SECRET=${JWT_SECRET}\n'
              printf '      - SPRING_AI_GOOGLE_GENAI_API_KEY=${GEMINI_API_KEY}\n'
              printf '      - SPRING_AI_GOOGLE_GENAI_PROJECT_ID=${GEMINI_PROJECT_ID}\n'
              printf '      - METRICS_PROMETHEUS_URL=${PROMETHEUS_URL}\n'
              printf '    networks:\n'
              printf '      - msa-network\n'
              printf '    healthcheck:\n'
              printf '      test: ["CMD-SHELL", "if command -v wget >/dev/null 2>&1; then wget -q --spider http://localhost:8080/actuator/health; elif command -v curl >/dev/null 2>&1; then curl -fsS http://localhost:8080/actuator/health >/dev/null; else exit 1; fi"]\n'
              printf '      interval: 30s\n'
              printf '      timeout: 10s\n'
              printf '      retries: 3\n'
              printf '      start_period: 360s\n\n'

              printf '  auth-server:\n'
              printf '    image: ghcr.io/gilmokhub/auth:${AUTH_TAG:-latest}\n'
              printf '    container_name: auth-server\n'
              printf '    ports:\n'
              printf '      - "9000:9000"\n'
              printf '    restart: always\n'
              printf '    environment:\n'
              printf '      - TZ=Asia/Seoul\n'
              printf '      - SPRING_PROFILES_ACTIVE=prod\n'
              printf '      - SPRING_DATASOURCE_URL=${DB_URL}\n'
              printf '      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}\n'
              printf '      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}\n'
              printf '      - SPRING_DATA_REDIS_URL=${REDIS_URL}\n'
              printf '      - APP_JWT_SECRET=${JWT_SECRET}\n'
              printf '    networks:\n'
              printf '      - msa-network\n'
              printf '    healthcheck:\n'
              printf '      test: ["CMD-SHELL", "if command -v wget >/dev/null 2>&1; then wget -q --spider http://localhost:9000/actuator/health; elif command -v curl >/dev/null 2>&1; then curl -fsS http://localhost:9000/actuator/health >/dev/null; else exit 1; fi"]\n'
              printf '      interval: 30s\n'
              printf '      timeout: 10s\n'
              printf '      retries: 3\n'
              printf '      start_period: 90s\n\n'

              printf '  frontend:\n'
              printf '    image: ghcr.io/gilmokhub/frontend:${FRONTEND_TAG:-latest-%s}\n' "$DEPLOY_TARGET"
              printf '    container_name: frontend\n'
              printf '    expose:\n'
              printf '      - "8080"\n'
              printf '    restart: always\n'
              printf '    networks:\n'
              printf '      - msa-network\n\n'

              printf 'networks:\n'
              printf '  msa-network:\n'
              printf '    external: true\n'
            } > docker-compose.yml.tmp
            mv docker-compose.yml.tmp docker-compose.yml

            if [[ "$SERVICE_NAME" == "gateway-server" ]]; then
              echo "🔵 Gateway Blue/Green Deployment..."
              if [ "$ACTIVE_GATEWAY" == "gateway-blue" ]; then
                CURRENT_COLOR="blue"; TARGET_COLOR="green"
              else
                CURRENT_COLOR="green"; TARGET_COLOR="blue"
              fi
              echo "Current: $CURRENT_COLOR / Target: $TARGET_COLOR"

              run_compose pull "gateway-$TARGET_COLOR"
              run_compose up -d "gateway-$TARGET_COLOR"

              echo "Waiting for Health Check..."
              for i in {1..72}; do
                status="$(sudo docker inspect --format='{{.State.Health.Status}}' "gateway-$TARGET_COLOR" 2>/dev/null || echo "starting")"
                if [ "$status" = "healthy" ]; then
                  echo "✅ Health Check Passed!"; break
                fi
                if [ "$status" = "unhealthy" ]; then
                  echo "❌ Container entered unhealthy state. Aborting..."
                  echo "====== gateway-$TARGET_COLOR LOGS ======"
                  sudo docker logs "gateway-$TARGET_COLOR" --tail 50
                  echo "====== END OF LOGS ======"
                  run_compose stop "gateway-$TARGET_COLOR"; exit 1
                fi
                if [ "$i" -eq 72 ]; then
                  echo "❌ Health Check Timed Out. Aborting..."
                  echo "====== gateway-$TARGET_COLOR LOGS ======"
                  sudo docker logs "gateway-$TARGET_COLOR" --tail 50
                  echo "====== END OF LOGS ======"
                  run_compose stop "gateway-$TARGET_COLOR"; exit 1
                fi
                echo "Checking... ($i/72)"; sleep 5
              done

              echo "Switching Traffic to $TARGET_COLOR..."
              cp ./nginx/conf.d/default.conf ./nginx/conf.d/default.conf.bak
              render_nginx_conf "gateway-$TARGET_COLOR"

              if is_nginx_running; then
                if ! NGINX_TEST_OUT=$(sudo docker exec nginx nginx -t 2>&1); then
                  if echo "$NGINX_TEST_OUT" | grep -qi "restarting"; then
                    echo "⚠️ Nginx is in a restart loop. Forcing recreate..."
                    if ! start_and_verify_nginx; then
                      cp ./nginx/conf.d/default.conf.bak ./nginx/conf.d/default.conf
                      exit 1
                    fi
                  else
                    echo "$NGINX_TEST_OUT"
                    echo "⬅️ Nginx config test failed. Rolling back..."
                    cp ./nginx/conf.d/default.conf.bak ./nginx/conf.d/default.conf
                    exit 1
                  fi
                else
                  sudo docker exec nginx nginx -s reload
                fi
              else
                if ! start_and_verify_nginx; then
                  cp ./nginx/conf.d/default.conf.bak ./nginx/conf.d/default.conf
                  exit 1
                fi
              fi

              echo "Stopping Old Version ($CURRENT_COLOR)..."
              run_compose stop "gateway-$CURRENT_COLOR"
              rm -f ./nginx/conf.d/default.conf.bak

            else
              echo "🟢 Standard Deployment for $SERVICE_NAME..."

              if [[ "$SERVICE_NAME" == "frontend-server" ]]; then
                COMPOSE_SERVICE="frontend"
              else
                COMPOSE_SERVICE="$SERVICE_NAME"
              fi

              run_compose pull "$COMPOSE_SERVICE"
              run_compose up -d --remove-orphans "$COMPOSE_SERVICE"

              echo "Waiting for Health Check..."
              for i in {1..24}; do
                status="$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$COMPOSE_SERVICE" 2>/dev/null || echo "starting")"
                if [ "$status" = "healthy" ] || [ "$status" = "none" ]; then
                  echo "✅ Health Check Passed (status: $status)!"; break
                fi
                if [ "$status" = "unhealthy" ]; then
                  echo "❌ Container entered unhealthy state. Aborting..."
                  echo "====== $COMPOSE_SERVICE LOGS ======"
                  sudo docker logs "$COMPOSE_SERVICE" --tail 50
                  echo "====== END OF LOGS ======"
                  exit 1
                fi
                if [ "$i" -eq 24 ]; then
                  echo "❌ Health Check Timed Out. Aborting..."
                  echo "====== $COMPOSE_SERVICE LOGS ======"
                  sudo docker logs "$COMPOSE_SERVICE" --tail 50
                  echo "====== END OF LOGS ======"
                  exit 1
                fi
                echo "Checking... ($i/24)"; sleep 10
              done

              if ! is_nginx_running; then
                if ! start_and_verify_nginx; then
                  exit 1
                fi
              fi
            fi

            echo "✨ All Done!"
