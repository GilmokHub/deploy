name: Trigger Deploy via Watchtower

on:
  repository_dispatch:
    types: [update-image]
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Deploy Service Name'
        required: true
        type: choice
        options:
          - platform-backend
          - platform-frontend
          - demo-backend
          - demo-frontend

jobs:
  notify-watchtower:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Watchtower
        uses: fjogeleit/http-request-action@v1
        with:
          url: '${{ startsWith(github.event.client_payload.service_name || inputs.service_name, "platform") && secrets.OCI_PLATFORM_URL || secrets.OCI_DEMO_URL }}/watchtower/v1/update?containers=${{ github.event.client_payload.service_name || inputs.service_name }}'
          method: 'GET'
          bearerToken: '${{ secrets.WATCHTOWER_TOKEN }}'
          timeout: '180000'

      - name: Verify Service Health Check
        uses: fjogeleit/http-request-action@v1
        with:
          url: '${{ (startsWith(github.event.client_payload.service_name || inputs.service_name, "platform") && secrets.OCI_PLATFORM_URL || secrets.OCI_DEMO_URL) }}${{ (github.event.client_payload.service_name || inputs.service_name) == "platform-backend" && "/gilmok-platform/actuator/health" || ((github.event.client_payload.service_name || inputs.service_name) == "demo-backend" && "/gilmok-demo/actuator/health" || "/") }}'
          method: 'GET'
          retry: 6
          retryWait: 10000
          timeout: '10000'
