name: Deploy Monitoring to OCI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'monitoring/**'
      - '.github/workflows/deploy-monitoring.yml'

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Copy monitoring configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MONITORING_HOST }}
          username: ${{ secrets.MONITORING_USERNAME }}
          key: ${{ secrets.MONITORING_KEY }}
          source: "monitoring/"
          target: "~/monitoring/"
          strip_components: 1

      - name: Deploy Monitoring Stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          GRAFANA_DOMAIN: ${{ secrets.GRAFANA_DOMAIN }}
          APP_SERVER_IP: ${{ secrets.OCI_PLATFORM_HOST }}
        with:
          host: ${{ secrets.MONITORING_HOST }}
          username: ${{ secrets.MONITORING_USERNAME }}
          key: ${{ secrets.MONITORING_KEY }}
          timeout: 180s
          envs: GRAFANA_PASSWORD,GRAFANA_DOMAIN,APP_SERVER_IP
          script: |
            cd ~/monitoring
            sudo docker compose -f docker-compose.monitoring.prod.yml pull
            sudo docker compose -f docker-compose.monitoring.prod.yml up -d --remove-orphans
            sudo docker compose -f docker-compose.monitoring.prod.yml ps
