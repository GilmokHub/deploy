version: '3.8'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:?PLATFORM_DOMAIN_is_required_in_env}
      - NGINX_ENVSUBST_FILTER=PLATFORM_DOMAIN
    volumes:
      - ./nginx/templates/platform.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - platform-network
    depends_on:
      - platform-backend
      - platform-frontend

  platform-backend:
    image: ghcr.io/gilmokhub/platform-backend:latest
    container_name: platform-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/gilmok_platform_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - SPRING_DATA_REDIS_SSL_ENABLED=false
      - GEMINI_PROJECT_ID=${GEMINI_PROJECT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PLATFORM_JWT_PRIVATE_KEY=${PLATFORM_JWT_PRIVATE_KEY}
      - PLATFORM_JWT_PUBLIC_KEY=${PLATFORM_JWT_PUBLIC_KEY}
      - PLATFORM_ADMIN_KEY_MASTER=${PLATFORM_ADMIN_KEY_MASTER}
      - PLATFORM_ADMIN_KEY_DEMO=${PLATFORM_ADMIN_KEY_DEMO}
      - PROMETHEUS_URL=${PROMETHEUS_URL}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    networks:
      - platform-network
    depends_on:
      - mysql
      - redis

  platform-frontend:
    image: ghcr.io/gilmokhub/platform-frontend:latest
    container_name: platform-frontend
    restart: always
    networks:
      - platform-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - platform-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=gilmok_platform_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - platform-network

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/.docker/config.json:/config.json:ro
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge

volumes:
  redis-data:
  mysql-data:
