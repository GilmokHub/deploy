version: '3.8'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DEMO_DOMAIN=${DEMO_DOMAIN:?DEMO_DOMAIN_is_required_in_env}
      - NGINX_ENVSUBST_FILTER=DEMO_DOMAIN
    volumes:
      - ./nginx/templates/demo.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - demo-network
    depends_on:
      - demo-backend
      - demo-frontend

  demo-backend:
    image: ghcr.io/gilmokhub/demo-backend:latest
    container_name: demo-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/demo_ticketing_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - SPRING_DATA_REDIS_SSL_ENABLED=false
      - JWT_SECRET=${JWT_SECRET}
      - GILMOK_ADMISSION_JWKS_URI=${GILMOK_ADMISSION_JWKS_URI}
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    networks:
      - demo-network
    depends_on:
      - mysql
      - redis

  demo-frontend:
    image: ghcr.io/gilmokhub/demo-frontend:latest
    container_name: demo-frontend
    restart: always
    networks:
      - demo-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - demo-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=demo_ticketing_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init/demo:/docker-entrypoint-initdb.d:ro
    networks:
      - demo-network

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/.docker/config.json:/config.json:ro
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
    networks:
      - demo-network

networks:
  demo-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
