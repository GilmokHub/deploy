global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

#  - job_name: 'node-exporter'  # 서버 CPU/RAM
#    static_configs:
#      - targets: ['node-exporter:9100']
#
#  - job_name: 'cadvisor'       # 컨테이너별 사용량
#    static_configs:
#      # cAdvisor는 이미 위에서 정의된 8082 포트를 사용
#      - targets: ['host.docker.internal:8082']

  # [1] 길목 대기열 플랫폼 백엔드 (:8082, context-path: /gilmok-platform)
  - job_name: 'platform-backend'
    metrics_path: '/gilmok-platform/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          application: 'platform-backend'

  # [2] 고객사 데모 백엔드 (:8081)
  - job_name: 'demo-backend'
    metrics_path: '/gilmok-demo/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          application: 'demo-backend'
