global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'platform-actuator'
    metrics_path: '/gilmok-platform/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['10.0.0.250:80']
        labels:
          service: 'platform-backend'

  - job_name: 'demo-actuator'
    metrics_path: '/gilmok-demo/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['10.0.0.234:80']
        labels:
          service: 'demo-backend'
